*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{background:#DCE4DB;font-family:"Noto Sans JP",sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}.stage{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}.slide{position:absolute;inset:0;width:1280px;height:720px;background:radial-gradient(130% 100% at 88% -8%,rgba(138,164,145,.16),transparent 55%),radial-gradient(120% 120% at 0% 108%,rgba(191,164,105,.07),transparent 50%),var(--porcelain);box-shadow:0 34px 90px -34px rgba(35,50,40,.55);padding:62px 92px 54px;display:none;flex-direction:column;opacity:0;transform:translateY(12px);transition:opacity .6s,transform .6s;overflow:hidden}.slide.active{display:flex;opacity:1;transform:none}.slide .botanical{position:absolute;right:-40px;bottom:-56px;width:340px;opacity:.09;pointer-events:none;color:var(--celadon-dk)}.slide .botanical svg{width:100%}.eyebrow{display:flex;align-items:center;gap:13px;margin-bottom:20px}.eyebrow:before{content:"";width:26px;height:1px;background:var(--gold)}.eyebrow .en{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:var(--celadon-dk);letter-spacing:.06em}.eyebrow .jp{font-size:11px;letter-spacing:.34em;color:var(--gold);font-weight:500}h1,h2{font-family:"Shippori Mincho",serif;color:var(--sasa);line-height:1.34;font-weight:500}h1{font-size:46px}h2{font-size:31px;font-weight:600}.lede{font-size:15.5px;color:var(--muted);line-height:2.05;margin-top:16px;font-weight:300;max-width:60ch}.hairline{height:1px;background:var(--hair);margin:22px 0}.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;position:relative;z-index:2}.pagefoot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:18px;position:relative;z-index:2}.pagefoot .lab{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:14px;color:var(--muted)}.p <script>
const LEAF=`<svg viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M150 285 C150 200 150 120 150 40"/><path d="M150 235 C110 220 82 188 74 150"/><path d="M150 205 C120 196 98 172 92 142"/><path d="M150 175 C120 168 100 146 96 120"/><path d="M150 250 C190 236 218 205 226 168"/><path d="M150 218 C182 210 205 186 210 158"/></svg>`;
const DROP=`<svg viewBox="0 0 100 100"><g fill="none" stroke="#8AA491" stroke-width="1"><circle class="ripple" cx="50" cy="54" r="30"/><circle class="ripple d2" cx="50" cy="54" r="30"/><circle class="ripple d3" cx="50" cy="54" r="30"/></g><path d="M50 20 C50 20 33 42 33 55 a17 17 0 0 0 34 0 C67 42 50 20 50 20 Z" fill="#8AA491" opacity=".9"/></svg>`;
const pf=()=>`<div class="pagefoot"><span class="lab">Fukubisui</span><span class="n"></span></div>`;
const slides=[
{title:'表紙',html:`<div class="slide cover"><div class="drop-mark">${DROP}</div><div class="botanical">${LEAF}</div><div class="inner"><div class="en-brand">Fukubisui</div><div class="en-sub">J A P A N E S E &nbsp; B O T A N I C A L &nbsp; S K I N C A R E</div><h1>福美水　ご提案資料</h1><div class="tag">施術後ケア・店販・アメニティ導線をつくる<br>スキンケア提案</div><div class="meta">For　＿＿＿＿＿＿＿＿＿ 様<br>Date　2026年＿月＿日　／　Presenter　＿＿＿＿</div></div></div>`,note:`つかみは商品ではなく“場の定義”。\n\n「本日はお時間ありがとうございます。福美人の〇〇です。本日は化粧水の売り込みというより、御社のお客様にどんな場面でお役立てできそうかを、一緒に確認できればと思っています」\n\n<strong>商談者メモ：</strong>売り込み臭を消す。御社名・日付・担当は事前に差し替える。`},
{title:'本日の目的',html:`<div class="slide"><div class="eyebrow"><span class="en">Purpose</span><span class="jp">本日の目的</span></div><div class="body"><h2>商品紹介ではなく、<br>“御社のお客様に合う利用シーン”を一緒に確認する場です</h2><div class="hairline"></div><ul class="clean"><li>成分やスペックの説明を聞いていただく時間ではありません。</li><li>御社のお客様の肌ケア・物販・アメニティの<b>現状</b>をうかがい、福美水が自然に置ける場面があるかを見極めます。</li></ul><div class="grid3" style="margin-top:26px"><div class="panel"><span class="klabel">Check 01</span><p>肌ケア・物販・アメニティまわりの現状</p></div><div class="panel"><span class="klabel">Check 02</span><p>福美水が合いそうな利用シーン</p></div><div class="panel warm"><span class="klabel">Check 03</span><p>（サンプル後）導入アイテム・時期・数量感</p></div></div></div>${pf()}</div>`,note:`<strong>目的：</strong>今日は決めていただく場ではない、と明言してハードルを下げる。\n\n「本日は3点だけ確認させてください。①肌ケアや物販の今の形、②福美水が合いそうな場面、③もしサンプルを見ていただけるなら、どのアイテム・時期・数量が現実的か」\n\n<strong>ヒアリング：</strong>現状の施術後ケア／既存店販商品／敏感肌のお客様の有無／商品説明のしやすさ。`},
{title:'業態共通の課題',html:`<div class="slide"><div class="eyebrow"><span class="en">The Gap</span><span class="jp">業態共通の課題</span></div><div class="body"><h2>「施術後・利用後に肌が敏感になる瞬間」は、<br>多くの業態で起こり得る</h2><div class="lede">レーザー・ピーリング・脱毛・カラー・パーマ、あるいは長旅のあと。肌が一時的にゆらぎやすくなる場面は、業態ごとに生じることがあります。</div><div class="contrast" style="margin-top:24px"><div class="xbox"><span class="tag">現場でよくある状態</span><p>高額な院内専売品を案内するか、<br>あるいは何もお渡ししないか、の二択。</p></div><div class="obox"><span class="tag">見えている歪み</span><p>“施術後ケアの標準解”が、<br>業態を横断すると<span class="em">定まりにくい</span></p><div class="sub">施設側が幅広いお客様へ案内しやすい共通ケアを設計しづらい状態があります。</div></div></div></div>${pf()}</div>`,note:`<strong>商談の入口：</strong>「施術後に肌が敏感になったお客様へ、御社では何を案内されていますか？」\n\n成分説明から入らず、現場の空白を先に言語化する。相手に喋らせる。\n\n「高い専売品しかない」「特に何も」どちらが出ても、置く理由の仮説につなぐ。`},
{title:'福美水の再定義',html:`<div class="slide"><div class="eyebrow"><span class="en">Redefined</span><span class="jp">福美水の再定義</span></div><div class="body"><h2>「低刺激スキンケア」だけではありません</h2><div class="contrast" style="margin-top:26px"><div class="xbox"><span class="tag">こう見られがち</span><p>肌にやさしいだけの、<br>“守り”の敏感肌化粧水</p></div><div class="obox"><span class="tag">提案したい価値</span><p>敏感肌の方も、日々のケアを<br><span class="em">前向きに続けやすい</span>一本</p><div class="sub">施術後など肌がゆらぎやすい場面でも、施設側が保湿ケアの候補として検討しやすい設計。</div></div></div></div>${pf()}</div>`,note:`この資料の背骨。<strong>「低刺激だから安全」で終わらせない。</strong>\n\n「敏感肌向けって“守り”の印象が強いですよね。福美水は、肌が弱い方でも日々のケアを前向きに続けやすい、という設計思想です」\n\n<strong>注意：</strong>医療効果・治療効果を示唆しない。`},
{title:'商品特徴',html:`<div class="slide"><div class="eyebrow"><span class="en">Formula</span><span class="jp">商品特徴</span></div><div class="body"><h2>肌質を選びにくく、<br>“施設が幅広いお客様に案内しやすい”設計</h2><div class="grid2" style="margin-top:24px"><ul class="clean"><li><b>日本由来の植物成分</b>にこだわった処方<br>（ヨモギ・クマザサ・白樺樹液・トレハロース）</li><li><b>無香料・低刺激設計</b>で、香りや刺激が気になる方にも案内しやすい</li><li>男性・お子様・ご年配まで、<b>幅広い世代で検討しやすい</b></li></ul><ul class="clean"><li>敏感肌向けでありながら、<span class="accent">日々の美肌ケア</span>まで見据えた設計思想</li><li>業態ごとに使い方を変えられる<br>（施術後／アメニティ／頭皮・毛先／保湿）</li><li>1本で幅広い客層に案内しやすく、<b>在庫・説明をシンプルにしやすい</b></li></ul></div></div>${pf()}</div>`,note:`特徴は施設側のメリットに翻訳して話す。\n\n「無香料で肌質を選びにくく、幅広いお客様への案内候補として検討しやすい。1本で案内しやすいぶん、在庫も説明もシンプルにしやすいです」\n\n<strong>薬機法注意：</strong>「抗炎症」「治る」「ニキビに効く」「施術後でも安全」等は言わない。「低刺激設計」「保湿ケアとして案内しやすい」に言い換える。`},
{title:'実績・信頼材料',html:`<div class="slide"><div class="eyebrow"><span class="en">Trusted</span><span class="jp">実績・信頼材料</span></div><div class="body"><h2>複数の販路で選ばれ続けているブランドです</h2><div class="grid2" style="margin-top:22px"><div class="panel"><h3>物販・小売の実績</h3><ul><li>百貨店・セレクト小売での取り扱い</li><li>ドラッグストア・調剤薬局での取り扱い</li></ul></div><div class="panel"><h3>体験・インバウンド販路</h3><ul><li>高級老舗旅館でのアメニティ採用</li><li>免税・越境EC・海外ECなどインバウンド販路</li></ul></div></div></div>${pf()}</div>`,note:`実績は権威づけではなく安心材料として軽く出し、すぐ相手軸に戻す。\n\n「百貨店やドラッグストア、調剤薬局、高級老舗旅館のアメニティなどでも扱っていただいています。ただ今日は、有名店に入っているからという話ではなく、御社のお客様に自然に合う場面があるかを確認したいです」\n\n<strong>内部ルール：</strong>具体施設名は原則出さない。累計本数など未確認の定量値は断定しない。`},
{title:'業態別❶ エステ／クリニック',html:`<div class="slide"><div class="eyebrow"><span class="en">Salon & Clinic ❶</span><span class="jp">エステ／美容皮膚科・クリニック</span></div><div class="body"><div class="grid2"><div class="panel"><h3>現場課題</h3><ul><li>施術後、肌が一時的に敏感になるお客様への案内</li><li>院内専売品が高く、全員には案内しづらい</li><li>敏感肌のお客様に出せる共通の一本がない</li></ul></div><div class="panel"><h3>福美水が置ける理由</h3><ul><li>幅広いお客様に案内しやすい保湿ケア候補</li><li>無香料・低刺激設計で説明しやすい</li><li>院内物販・店販の新しい選択肢になり得る</li></ul></div></div><div class="grid2" style="margin-top:18px"><div class="panel warm"><h3>提案アイテム</h3><p><b>化粧水（主力）</b>／ホームケア・院内店販として</p></div><div class="panel"><h3>サンプル後に確認したいこと</h3><p>スタッフの使用感／案内しやすさ／価格・ロット感</p></div></div></div>${pf()}</div>`,note:`<strong>ヒアリング：</strong>施術後のホームケアは今どう案内？ 店販の売れ筋は？ 誰が説明する？\n\n刺す一言：「高額な専売品だけだとハードルが高い場面もある。福美水が保湿ケアの選択肢になり得るか、まずスタッフ様に見ていただきたい」\n\n<strong>薬機法：</strong>治る／炎症を抑える／医療効果／施術直後の使用保証は言わない。`},
{title:'業態別❷ 脱毛／日焼け',html:`<div class="slide"><div class="eyebrow"><span class="en">Salon ❷</span><span class="jp">脱毛／日焼けサロン</span></div><div class="body"><div class="grid2"><div class="panel"><h3>現場課題</h3><ul><li>施術・日焼け後の乾燥が気になる場面</li><li>男性客にも案内しやすい商品が必要</li><li>香りつき商品は好みが分かれる</li></ul></div><div class="panel"><h3>福美水が置ける理由</h3><ul><li>無香料で男性客にも案内しやすい</li><li>保湿ケアの導線を作りやすい</li><li>化粧水＋クリームジェルの組み合わせ</li></ul></div></div><div class="grid2" style="margin-top:18px"><div class="panel warm"><h3>提案アイテム</h3><p><b>化粧水＋クリームジェル</b>／保湿ケアとして</p></div><div class="panel"><h3>サンプル後に確認したいこと</h3><p>スタッフの使用感・べたつき・のび／ロット感</p></div></div></div>${pf()}</div>`,note:`<strong>ヒアリング：</strong>施術後の保湿案内は？ 既存ジェルの不満は？ 男性客の比率は？\n\n刺す一言：「化粧水に加えてクリームジェルも、保湿導線として見ていただけます」\n\n男性客・無香料の相性を強調。既存ジェルの不満を引き出せると置換・補完の話に。`},
{title:'業態別❸ 高級旅館',html:`<div class="slide"><div class="eyebrow"><span class="en">Ryokan ❸</span><span class="jp">高級旅館</span></div><div class="body"><div class="grid2"><div class="panel"><h3>現場課題</h3><ul><li>アメニティが消耗コストで止まりやすい</li><li>気に入った客が買って帰る物販導線が弱い</li><li>香りの強いアメニティは好みが割れる</li></ul></div><div class="panel"><h3>福美水が置ける理由</h3><ul><li>無香料で幅広い宿泊客に体験してもらいやすい</li><li>体験 → 売店・EC・お土産へ物販化できる</li><li>「日本の植物」という物語を伝えやすい</li></ul></div></div><div class="grid2" style="margin-top:18px"><div class="panel warm"><h3>提案アイテム</h3><p><b>アメニティ化粧水 ＋ 売店／EC物販</b></p></div><div class="panel"><h3>サンプル後に確認したいこと</h3><p>宿の世界観・客層との相性／物販導線／ロット</p></div></div></div>${pf()}</div>`,note:`<strong>ヒアリング：</strong>客室のスキンケアは？ 売店・ECの購入導線は？ 物販を強化したい？\n\n刺す一言：「アメニティで体験し、気に入った方が売店やECで買って帰る導線を作れます」\n\n<strong>内部判断：</strong>低価格帯・ビジホは優先外。温度が高い先は訪問着地も検討。`},
{title:'業態別❹ 美容室',html:`<div class="slide"><div class="eyebrow"><span class="en">Hair Salon ❹</span><span class="jp">美容室</span></div><div class="body"><div class="grid2"><div class="panel"><h3>現場課題</h3><ul><li>カラー・パーマ後のホームケア相談</li><li>店販が伸び悩む／スタッフ間で温度差</li><li>メンズ客への頭皮ケア提案が弱い</li></ul></div><div class="panel"><h3>福美水が置ける理由</h3><ul><li>美容液・オイル・スカルプまで提案できる</li><li>無香料でメンズ提案にも合わせやすい</li><li>店販の新しいホームケア候補になる</li></ul></div></div><div class="grid2" style="margin-top:18px"><div class="panel warm"><h3>提案アイテム</h3><p><b>美容液・オイル（＋スカルプ／メンズ頭皮）</b></p></div><div class="panel"><h3>サンプル後に確認したいこと</h3><p>スタッフが説明しやすいか／店販カテゴリとの相性／ロット</p></div></div></div>${pf()}</div>`,note:`<strong>ヒアリング：</strong>カラー・パーマ後のケア相談は？ 店販の売れ筋カテゴリは？ メンズ提案は？\n\n刺す一言：「化粧水単体ではなく、美容液・オイル・スカルプまで含めてホームケア導線として見ていただけます」`},
{title:'サンプル送付の進め方',html:`<div class="slide"><div class="eyebrow"><span class="en">Sampling</span><span class="jp">サンプル送付の進め方</span></div><div class="body"><h2>サンプルから、具体的な導入イメージへ</h2><div class="lede">実際の使用感をご確認いただいたうえで、御社に合うアイテム・時期・数量感を一緒に整理します。</div><div class="grid3" style="margin-top:24px"><div class="panel warm"><span class="klabel">01</span><h3>アイテム</h3><p>化粧水／クリームジェル／美容液・オイル／スカルプ ほか</p></div><div class="panel warm"><span class="klabel">02</span><h3>時期</h3><p>すぐ／1〜2か月以内／季節キャンペーン／入れ替え時期</p></div><div class="panel warm"><span class="klabel">03</span><h3>数量感</h3><p>店舗テスト／スタッフ利用／一部顧客案内／店販在庫</p></div></div></div>${pf()}</div>`,note:`<strong>内部目的：</strong>サンプルを単なる無料配布で終わらせない。\n\n「ただお送りするのではなく、御社で導入余地があるかを確認したうえでお送りしたいんです。今の仮でかまいませんので、どのアイテムが合いそうか、いつ頃が現実的か、どのくらいの数量から試せそうかを教えてください」\n\n<strong>確認項目：</strong>導入アイテム／導入時期／導入数量／使用感確認日。\n<strong>内部メモ：</strong>3点が取れない場合は温度感を再確認。キャンペーン条件や同封資料は商談者側だけで管理する。`},
{title:'導入検討ステップ',html:`<div class="slide"><div class="eyebrow"><span class="en">Journey</span><span class="jp">導入検討ステップ</span></div><div class="body"><h2>サンプルから導入検討までの流れ</h2><div class="flow" style="margin-top:28px"><span class="chip">サンプル確認</span><span class="arw">→</span><span class="chip">スタッフ使用</span><span class="arw">→</span><span class="chip">案内可否の検討</span><span class="arw">→</span><span class="chip">使用感ヒアリング</span><span class="arw">→</span><span class="chip hot">アイテム／時期／数量 整理</span><span class="arw">→</span><span class="chip hot">次回商談</span></div><div class="hairline" style="margin-top:30px"></div><ul class="clean"><li>まずはスタッフ様ご自身で使用感をご確認ください。</li><li>御社の運用に沿って、お客様への案内可否をご検討いただきます。</li><li>使用感をうかがいながら、次の導入検討へ進めます。</li></ul></div>${pf()}</div>`,note:`<strong>ここで使用感確認日を握る。</strong>\n\n「まずサンプルをスタッフ様に見ていただいて、そのうえで御社の運用に沿ってお客様への案内可否をご検討ください。使用感を確認するお時間を15分ほどお願いします」\n\n<strong>温度感記録：</strong>A＝時期・数量まで具体化／B＝使用感確認後に判断／C＝サンプル希望のみ／D＝情報収集／NG＝導入余地なし。\n<strong>内部運用：</strong>Aは即トスアップ、Bは使用感確認後、C/Dは追客、NGは除外。`},
{title:'次のアクション',html:`<div class="slide"><div class="eyebrow"><span class="en">Next Step</span><span class="jp">次のアクション</span></div><div class="body"><h2>サンプル確認後の次のステップ</h2><div class="grid3" style="margin-top:24px"><div class="panel"><span class="klabel">Step 01</span><h3>サンプル送付</h3><p>ご相談したアイテムを御社宛に送付します。</p></div><div class="panel warm"><span class="klabel">Step 02</span><h3>使用感確認</h3><p>スタッフ様のご感想を15分程度でうかがいます。</p></div><div class="panel"><span class="klabel">Step 03</span><h3>導入検討</h3><p>アイテム・時期・数量感を整理し、次のご相談へ。</p></div></div></div>${pf()}</div>`,note:`クロージングは決断ではなく<strong>次の日程を取る</strong>。\n\n「本日のお話だと、御社の場合は〇〇の場面で試していただくのが一番自然だと感じました。まずサンプルをお送りするので、使用感を確認するお時間だけ、仮でこの場で押さえさせてください」\n\n<strong>商談者メモ：</strong>顧客画面には個別の「まとめ」や穴埋め文言を出さない。利用シーンの言語化は口頭で行う。\n<strong>最終チェック：</strong>導入アイテム／時期／数量／使用感確認日。`}
];
const stage=document.getElementById('stage');slides.forEach((s,i)=>{const d=document.createElement('div');d.innerHTML=s.html;const el=d.firstElementChild;el.dataset.i=i;stage.appendChild(el)});const els=[...document.querySelectorAll('.slide')];const N=slides.length;let cur=0;const isPresenter=location.hash.includes('presenter');const CH=('BroadcastChannel'in window)?new BroadcastChannel('fukubisui-deck'):null;
function fit(){if(innerWidth<=680){document.documentElement.style.setProperty('--s','1');return}const s=Math.min((innerWidth-48)/1280,(innerHeight-48)/720);document.documentElement.style.setProperty('--s',String(s))}
function decorateSlide(i){const foot=els[i]?.querySelector('.pagefoot .n');if(foot)foot.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${String(N).padStart(2,'0')}`}
function paintAudience(){els.forEach((e,k)=>e.classList.toggle('active',k===cur));decorateSlide(cur);prog.textContent=`${String(cur+1).padStart(2,'0')} / ${String(N).padStart(2,'0')}`;bar.style.width=`${((cur+1)/N)*100}%`;document.getElementById('nt-title').textContent=`${cur+1}. ${slides[cur].title}`;document.getElementById('nt-body').innerHTML=slides[cur].note;els[cur].scrollTop=0}
function renderThumb(container,i){container.innerHTML='';const sc=document.createElement('div');sc.className='thumbScale';sc.innerHTML=slides[i]?.html||'';container.appendChild(sc);decorateClone(sc,i);const scale=container.clientWidth/1280;sc.style.transform=`scale(${scale})`;container.style.height=`${container.clientWidth*720/1280}px`}
function decorateClone(root,i){const foot=root.querySelector('.pagefoot .n');if(foot)foot.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b> / ${String(N).padStart(2,'0')}`}
function paintPresenter(){document.getElementById('pcur').textContent=cur+1;document.getElementById('ptotal').textContent=N;document.getElementById('ptitle').textContent=`${cur+1}. ${slides[cur].title}`;document.getElementById('pnote').innerHTML=slides[cur].note;renderThumb(document.getElementById('thumbCur'),cur);const ni=Math.min(cur+1,N-1);renderThumb(document.getElementById('thumbNext'),ni);document.getElementById('nextlabel').textContent=cur+1<N?'次のスライド':'（最終スライド）';document.getElementById('thumbNext').style.opacity=cur+1<N?'1':'.25'}
function setIndex(i,broadcast=true){cur=Math.max(0,Math.min(N-1,i));isPresenter?paintPresenter():paintAudience();if(broadcast){CH?.postMessage({type:'goto',i:cur});try{localStorage.setItem('fukubisui_i',`${cur}:${Date.now()}`)}catch(e){}}}function go(d){setIndex(cur+d)}window.go=go;
CH&&(CH.onmessage=e=>{const m=e.data||{};if(m.type==='goto')setIndex(m.i,false);else if(m.type==='hello'&&!isPresenter)CH.postMessage({type:'goto',i:cur})});window.addEventListener('storage',e=>{if(e.key==='fukubisui_i'&&e.newValue){const i=parseInt(e.newValue,10);if(!isNaN(i))setIndex(i,false)}});
function toggleNotes(){document.getElementById('notes').classList.toggle('open')}function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}function openPresenter(){window.open(location.href.split('#')[0]+'#presenter','fukubisui_presenter','width=1180,height=760')}window.toggleNotes=toggleNotes;window.fs=fs;window.openPresenter=openPresenter;
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key.toLowerCase()==='n')toggleNotes();else if(e.key.toLowerCase()==='f')fs();else if(e.key.toLowerCase()==='p')openPresenter();else if(e.key==='Home')setIndex(0);else if(e.key==='End')setIndex(N-1)});
let sx=0,sy=0;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.6)go(dx<0?1:-1)},{passive:true});
if(isPresenter){document.body.classList.add('presenter-mode');document.getElementById('pprev').onclick=()=>go(-1);document.getElementById('pnext').onclick=()=>go(1);const t0=Date.now();function tick(){const s=Math.floor((Date.now()-t0)/1000);document.getElementById('ptime').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;const d=new Date();document.getElementById('pclock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}tick();setInterval(tick,1000);addEventListener('resize',paintPresenter);paintPresenter();CH?.postMessage({type:'hello'})}else{addEventListener('resize',fit);fit();paintAudience()}
</script>
</body>
</html>
